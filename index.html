<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#050407" />
    <meta name="description" content="MARS: an open-weights model that masters one workflow and keeps improving itself on hardware you own." />
    <link rel="icon" href="/favicon.svg" />
    <title>MARS</title>
  </head>
  <body>
    <a class="skip-link" href="#waitlist">Skip to the waitlist</a>
    <canvas id="scene" aria-hidden="true"></canvas>
    <div id="fallback" hidden aria-hidden="true"><svg viewBox="0 0 100 100"><ellipse cx="50" cy="50" rx="43" ry="46" /></svg></div>
    <div class="grain" aria-hidden="true"></div>
    <div id="cursor" aria-hidden="true"></div>
    <p id="boot" aria-hidden="true">tracing · 000</p>
    <header class="ui corners">
      <a class="brand" href="#top">MARS</a>
      <a class="link" href="#waitlist">Waitlist</a>
    </header>
    <div class="panels" aria-hidden="true"></div>
    <div class="ui hud">
      <span id="counter" aria-live="polite">iter 000</span>
      <span class="tag">mastery · recursive self-improvement</span>
      <span id="hint">scroll</span>
    </div>
    <section id="waitlist" class="end" aria-label="Waitlist">
      <p class="end-copy">Every mission starts with one task.</p>
      <form id="access-form">
        <label class="sr-only" for="email">Email address</label>
        <input id="email" name="email" type="email" placeholder="you@domain.com" autocomplete="email" required />
        <button type="submit">request access</button>
        <p id="form-message" role="status">demo · nothing is stored yet</p>
      </form>
    </section>
    <button id="sound" class="ui" type="button" aria-pressed="false" aria-label="Ambient sound off">
      <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.2"><path d="M4 9.5v5h3.5L12 18V6L7.5 9.5H4z" /><path class="wave" d="M15 9.5a3.5 3.5 0 0 1 0 5" /><path class="wave" d="M17.5 7a7 7 0 0 1 0 10" /></svg>
    </button>
    <div id="track"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
